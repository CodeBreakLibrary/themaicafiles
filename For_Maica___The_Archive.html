<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>For Maica — the archive</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Cormorant:wght@300;500&family=Courier+Prime:ital@0;1&display=swap" rel="stylesheet">
<style>
  :root{
    --parchment:#ECE1C6; --parchment-dark:#DDCFA9; --ink:#2A2015;
    --forest:#152018; --oxblood:#5B2A2A;
    --gold:#B8935A; --gold-bright:#D8B978; --line:rgba(184,147,90,0.35);
  }
  *{ box-sizing:border-box; }
  html{ background:#0F1712; scroll-padding-top:env(safe-area-inset-top,0px); }
  body{
    margin:0; min-height:100vh;
    font-family:'Cormorant Garamond', serif;
    color:var(--parchment);
    background:
      radial-gradient(ellipse at 50% 0%, rgba(216,185,120,0.11), transparent 55%),
      linear-gradient(180deg, var(--forest) 0%, #0F1712 100%);
    padding:calc(56px + env(safe-area-inset-top,0px)) 24px calc(72px + env(safe-area-inset-bottom,0px));
  }
  .wrap{ max-width:680px; margin:0 auto; }

  /* header */
  header{ text-align:center; margin-bottom:56px; }
  .candle{ position:relative; width:10px; height:34px; margin:18px auto 22px; }
  .candle .body{ position:absolute; inset:0; border-radius:2px; background:linear-gradient(180deg,var(--parchment),var(--parchment-dark)); }
  .candle .flame{
    position:absolute; left:50%; top:-16px; width:10px; height:16px;
    transform:translateX(-50%); transform-origin:50% 100%;
    background:radial-gradient(circle at 50% 70%, #FFE9B0 0%, var(--gold-bright) 45%, transparent 75%);
    border-radius:50% 50% 50% 50% / 65% 65% 35% 35%;
    animation:flicker 2.6s ease-in-out infinite;
  }
  @keyframes flicker{
    0%,100%{ transform:translateX(-50%) rotate(-1.5deg) scaleY(1); }
    30%{ transform:translateX(-50%) rotate(1deg) scaleY(1.05); }
    55%{ transform:translateX(-50%) rotate(-1deg) scaleY(0.95); }
    80%{ transform:translateX(-50%) rotate(1.5deg) scaleY(1.03); }
  }
  h1{ margin:0; font-weight:500; font-size:clamp(42px,11vw,68px); line-height:1.05; }
  .sub{
    margin:14px auto 0; max-width:420px;
    font-family:'Cormorant',serif; font-weight:300; font-style:italic;
    font-size:clamp(16px,4vw,19px); line-height:1.5; text-wrap:balance;
    color:rgba(236,225,198,0.72);
  }

  /* the thread: one line, one dot per website, newest first */
  .thread{ list-style:none; margin:0; padding:0 0 0 44px; position:relative; }
  .thread::before{
    content:""; position:absolute; left:11px; top:10px; bottom:10px; width:1px;
    background:linear-gradient(180deg, var(--gold) 0%, var(--line) 30%, var(--line) 100%);
  }
  .thread li{ position:relative; margin:0 0 30px; }
  .thread li::before{
    content:""; position:absolute; left:-38px; top:22px; width:11px; height:11px;
    border-radius:50%; background:#0F1712; border:1px solid var(--gold);
  }
  .thread li:first-child::before{
    background:var(--gold-bright); border-color:var(--gold-bright);
    box-shadow:0 0 12px 3px rgba(216,185,120,0.55);
    animation:glow 2.6s ease-in-out infinite;
  }
  @keyframes glow{ 50%{ box-shadow:0 0 6px 1px rgba(216,185,120,0.35); } }

  .entry{
    display:flex; gap:20px; align-items:flex-start; justify-content:space-between;
    padding:22px 24px 24px;
    background:linear-gradient(180deg,var(--parchment) 0%,var(--parchment-dark) 100%);
    color:var(--ink); text-decoration:none;
    box-shadow:0 22px 44px rgba(0,0,0,0.4);
    transition:transform .25s ease;
  }
  a.entry:hover{ transform:translateX(5px); }
  a.entry:focus-visible{ outline:2px solid var(--gold-bright); outline-offset:4px; }
  .date{ font-family:'Courier Prime',monospace; font-size:12px; letter-spacing:0.04em; color:var(--oxblood); }
  .entry h2{ margin:6px 0 8px; font-weight:500; font-size:clamp(25px,6vw,31px); line-height:1.15; }
  .note{ margin:0; font-size:clamp(17px,4vw,19px); line-height:1.5; color:#3A2E1E; }
  .visit{ display:inline-block; margin-top:14px; font-style:italic; font-size:17px; color:var(--oxblood); border-bottom:1px solid rgba(91,42,42,0.4); }
  .pending .visit{ border:0; opacity:0.75; }
  .placeholder{ color:var(--oxblood); font-style:italic; }

  .thumb{
    flex:none; width:96px; margin:4px 0 0; padding:6px 6px 14px;
    background:#F7F1E1; box-shadow:0 6px 14px rgba(0,0,0,0.25);
    transform:rotate(2.5deg);
  }
  .thumb img{ display:block; width:100%; aspect-ratio:4/5; object-fit:cover; filter:sepia(0.15); }

  footer{
    margin-top:44px; text-align:center;
    font-family:'Cormorant',serif; font-style:italic; font-size:16px;
    color:rgba(236,225,198,0.55);
  }

  @media (max-width:520px){
    .thread{ padding-left:34px; }
    .thread::before{ left:6px; }
    .thread li::before{ left:-33px; }
    .entry{ flex-direction:column; padding:20px 20px 22px; }
    .thumb{ width:110px; transform:rotate(-2deg); }
  }
  @media (prefers-reduced-motion:reduce){
    .candle .flame, .thread li:first-child::before{ animation:none; }
    a.entry{ transition:none; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="candle"><div class="body"></div><div class="flame"></div></div>
    <h1>the archive</h1>
    <p class="sub">every little website I've made for you, kept in one place.</p>
  </header>

  <ol class="thread" id="thread"></ol>
  <footer id="count"></footer>
</div>

<script>
  // ======================= EDIT HERE =======================
  // One entry per website. Newest first: the top one gets the glowing dot.
  //   title : the site's name
  //   date  : when you made it or gave it (any text, e.g. 'December 2026')
  //   note  : a line or two about it
  //   url   : the site's link. Leave '' if it isn't hosted yet (the card shows as not linked)
  //   img   : optional small photo/screenshot: a path like "thumbs/carpe.jpg" or a data: URI. '' for none
  const SITES = [
    {
      title: 'For Maica — Carpe Diem',
      date: '[date]',
      note: 'a candle, a list, a tree, a letter.',
      url: '',
      img: ''
    },
    {
      title: '[second website title]',
      date: '[date]',
      note: '[A line about what this one was for, or what she did when she opened it.]',
      url: '',
      img: ''
    },
    {
      title: '[third website title]',
      date: '[date]',
      note: '[A line about it.]',
      url: '',
      img: ''
    }
  ];
  // =========================================================

  const thread = document.getElementById('thread');
  SITES.forEach(s => {
    const li = document.createElement('li');
    const linked = !!s.url;
    const card = document.createElement(linked ? 'a' : 'div');
    card.className = 'entry' + (linked ? '' : ' pending');
    if(linked){ card.href = s.url; card.target = '_blank'; card.rel = 'noopener'; }

    const text = document.createElement('div');
    const mark = t => /^\[.*\]$/.test(t) ? ' placeholder' : '';
    const d = document.createElement('div'); d.className = 'date' + mark(s.date); d.textContent = s.date;
    const h = document.createElement('h2'); h.textContent = s.title; if(mark(s.title)) h.className = 'placeholder';
    const p = document.createElement('p'); p.className = 'note' + mark(s.note); p.textContent = s.note;
    text.append(d, h, p);
    const v = document.createElement('span'); v.className = 'visit';
    v.textContent = linked ? 'open this one' : 'link not added yet';
    text.append(v);
    card.append(text);

    if(s.img){
      const f = document.createElement('div'); f.className = 'thumb';
      const im = document.createElement('img'); im.src = s.img; im.alt = '';
      f.append(im); card.append(f);
    }
    li.append(card); thread.append(li);
  });
  document.getElementById('count').textContent =
    SITES.length + (SITES.length === 1 ? ' website' : ' websites') + ', and counting.';
</script>
</body>
</html>
